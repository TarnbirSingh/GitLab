name: gitlab-ce-server
display_name: "GitLab CE Server"
description: "Selbst-gehostete GitLab Community Edition mit automatisch angelegten Studierenden-Accounts und optionalen GitLab-Gruppen."
version: "2.0.0"
category: "education"
author: "DHBW CloudStore Team"
icon: gitlab.png

terraform:
  working_dir: terraform/
  required_version: ">= 1.6.0"

tags:
  - gitlab
  - git
  - devops
  - education

email_credentials:
  enabled: true

deploy-strategy:
  one-instance: true

ui-groups:
  - id: general
    title: "Allgemein und Nutzer"
    order: 1
  - id: resources
    title: "Ressourcen"
    order: 2
  - id: specific
    title: "GitLab-Optionen"
    order: 3

parameters:

  general:
    - name: app_name
      type: string
      required: true
      validation:
        pattern: "^[a-z0-9-]{3,20}$"
      description: "Name der GitLab-Instanz"
      x-ui:
        group_id: general
        in_group_order: 1
        icon: Server
        placeholder: "z.B. wwi23sea-gitlab"
        hint: "Nur Kleinbuchstaben, Zahlen und Bindestriche (3-20 Zeichen)"

    - name: admin_username
      type: string
      required: true
      description: "Dozent (erhält GitLab-Root-Admin-Rechte)"
      x-ui:
        group_id: general
        in_group_order: 2
        icon: Users
        placeholder: "Dozent auswählen..."
        widget:
          type: user-picker
          multi: false
          extract: email

    - name: students
      type: array
      required: true
      validation:
        min_items: 1
        max_items: 30
      description: "Studierende (werden als GitLab-User angelegt)"
      x-ui:
        group_id: general
        in_group_order: 3
        icon: Users
        placeholder: "Studierende auswählen..."
        hint: "Alle teilnehmenden Studierenden auswählen — bekommen einen GitLab-User-Account. Pflicht für die optionale Gruppen-Einteilung unten."
        widget:
          type: user-picker
          multi: true
          extract: email

    - name: gitlab_groups
      type: groups
      required: false
      description: "GitLab-interne Gruppen mit Mitgliedern (optional)"
      x-ui:
        group_id: general
        in_group_order: 4
        icon: Users
        hint: "Optional: Studierende aus der Auswahl oben in GitLab-Gruppen organisieren (Developer-Rolle). Der Dozent ist automatisch Owner jeder Gruppe."
        widget:
          type: group-builder
          extract: email

  specific:
    - name: flavor_name
      type: selection
      required: true
      default: "gp1.large"
      options:
        - label: "Small (1 CPU, 2 GB RAM)"
          value: "gp1.small"
        - label: "Medium (2 CPU, 4 GB RAM)"
          value: "gp1.medium"
        - label: "Large (4 CPU, 8 GB RAM) — Empfohlen"
          value: "gp1.large"
      description: "VM-Größe"
      x-ui:
        group_id: resources
        in_group_order: 1
        icon: Cpu
        hint: "GitLab CE braucht mindestens 4 GB RAM — Large empfohlen."

    - name: gitlab_version
      type: string
      required: false
      default: "17.0.8-ce.0"
      description: "GitLab CE Paketversion"
      x-ui:
        group_id: specific
        in_group_order: 1
        icon: Server
        placeholder: "17.0.8-ce.0"
        hint: "Versionsnummer aus dem offiziellen GitLab-Repository."

outputs:
  - name: instance_id
    description: "System ID der Instanz"
    display: false

  - name: app_name
    description: "Name der Anwendung"
    display: true

  - name: gitlab_url
    description: "GitLab Web-Oberfläche"
    display: true

  - name: ssh_command
    description: "SSH-Zugang zur VM"
    display: true

  - name: admin_credentials
    description: "Admin-Zugangsdaten (Dozent)"
    sensitive: true
    display: false

  - name: student_credentials
    description: "Studierenden-Zugangsdaten"
    sensitive: true
    display: false

  - name: ssh_private_key
    description: "SSH Private Key"
    sensitive: true
    display: false
